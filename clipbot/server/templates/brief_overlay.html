<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teck Brief overlay · {{ frame }}</title>
  {# An OBS Browser Source. Size it 1920x1080 (1080x1920 for vertical) and leave
     the background transparent: nothing is drawn until Start is pressed in the dock. #}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/brief/scenes.css?v={{ ASSET_V }}">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
    body.bg-green { background: #00B140; }
    body.bg-brand { background: #0B1220; }
    #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    #note { position: absolute; left: 16px; bottom: 16px; font: 600 14px/1.4 "JetBrains Mono", monospace; color: #fff; background: rgba(11,18,32,.85); padding: 8px 12px; border-radius: 8px; display: none; }
  </style>
</head>
<body class="bg-{{ bg }}" data-frame="{{ frame }}" data-bg="{{ bg }}">
  <div class="stage" id="stage"></div>
  <div id="note"></div>
  <script src="/static/brief/scenes.js?v={{ ASSET_V }}"></script>
  <script src="/static/brief/live.js?v={{ ASSET_V }}"></script>
  <script src="/static/brief/overlay.js?v={{ ASSET_V }}"></script>
</body>
</html>
