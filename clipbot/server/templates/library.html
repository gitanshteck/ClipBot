{% extends "base.html" %}
{% block title %}Kick — ClipBot{% endblock %}
{% block content %}
<section class="panel">
  <h1>Kick</h1>
  <form id="new-vod" class="row">
    <input type="url" id="vod-url" placeholder="https://kick.com/&lt;channel&gt;/videos/&lt;uuid&gt;" required>
    <span id="quality-picker-slot"></span>
    <button type="submit">Add &amp; run pipeline</button>
  </form>
  <p class="hint">Downloads, extracts audio, transcribes (~0.8&times; realtime on CPU) and finds clips. You review before anything is cut.</p>
</section>

<section class="panel">
  <h1>Browse a channel</h1>
  <form id="browse-channel" class="row">
    <input type="text" id="channel-name" placeholder="kick channel name, e.g. gitanshteck" required>
    <button type="submit">Fetch VODs</button>
    <select id="upload-privacy" title="Visibility of videos sent to YouTube with &quot;To YouTube&quot;">
      <option value="private">YouTube: private</option>
      <option value="unlisted">YouTube: unlisted</option>
      <option value="public">YouTube: public</option>
    </select>
  </form>
  <p class="hint" id="browse-hint"></p>
  <div id="channel-vods" class="grid"></div>
</section>

<section id="workspaces" class="grid"></section>
{% endblock %}

{% block scripts %}
<script>
const grid = document.getElementById('workspaces');

// One quality picker, shared by the "paste a URL" form and every "Download"
// button in the channel browser below - same localStorage key workspace.html
// uses, so a choice made here carries over there too.
document.getElementById('quality-picker-slot').innerHTML = qualityPickerHtml('quality-picker');
const qualityPicker = document.getElementById('quality-picker');
// Visibility for "To YouTube". Remembered, but it always starts as private.
const privacyPicker = document.getElementById('upload-privacy');
privacyPicker.value = localStorage.getItem('clipbot.uploadPrivacy') || 'private';
privacyPicker.addEventListener('change', () =>
  localStorage.setItem('clipbot.uploadPrivacy', privacyPicker.value));
qualityPicker.value = localStorage.getItem('clipbot.downloadQuality') || '';
qualityPicker.addEventListener('change', () =>
  localStorage.setItem('clipbot.downloadQuality', qualityPicker.value));

// Card markup (and stageDots) live in app.js, shared with the YouTube tab.
async function loadWorkspaces() {
  const { workspaces: all } = await api('/api/workspaces');
  // This tab is Kick only; YouTube workspaces live on /youtube. A workspace
  // with no `platform` is Kick (the API defaults it), so nothing existing moves.
  const workspaces = all.filter(w => w.platform === 'kick');
  if (!workspaces.length) {
    grid.innerHTML = '<p class="empty">No Kick VODs yet. Paste a Kick URL above to start.</p>';
    return;
  }
  grid.innerHTML = workspaces.map(workspaceCardHtml).join('');
}

document.getElementById('new-vod').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('vod-url').value.trim();
  try {
    const res = await api('/api/workspaces', 'POST', { url, quality: qualityPicker.value || null });
    location.href = '/w/' + res.slug;
  } catch (err) { alert(err.message); }
});

const channelInput = document.getElementById('channel-name');
const vodGrid = document.getElementById('channel-vods');
const browseHint = document.getElementById('browse-hint');
const lastChannel = localStorage.getItem('clipbot.lastChannel');
if (lastChannel) {
  channelInput.value = lastChannel;
  loadChannelVods(lastChannel);
}

async function loadChannelVods(channel) {
  vodGrid.innerHTML = '';
  browseHint.textContent = 'Fetching…';
  try {
    const res = await api('/api/kick/' + encodeURIComponent(channel) + '/vods');
    if (!res.vods.length) {
      browseHint.textContent = 'No VODs found for /' + channel + '.';
      return;
    }
    browseHint.textContent = res.vods.length + ' most recent VODs on /' + channel + ':';
    vodGrid.innerHTML = res.vods.map(v => `
      <article class="card" data-uuid="${esc(v.uuid)}">
        ${v.thumbnail ? `<img src="${esc(v.thumbnail)}" alt="" class="thumb">` : ''}
        <h2>${esc(v.title || '(untitled)')}</h2>
        <div class="meta">
          ${v.duration_seconds ? fmtDur(v.duration_seconds) : '—'}
          ${v.created_at ? ' · ' + esc(v.created_at) : ''}
        </div>
        <div class="row">
          ${v.workspace_exists
            ? `<a class="btn" href="/w/${esc(v.slug)}">Open</a>`
            : `<button class="btn download-vod" data-url="${esc(v.url)}">Download</button>
               <button class="btn upload-vod" data-url="${esc(v.url)}"
                       title="Send this VOD straight to your YouTube channel - nothing is saved on this computer">To YouTube</button>`}
        </div>
      </article>`).join('');
  } catch (err) {
    browseHint.textContent = '';
    alert(err.message);
  }
}

document.getElementById('browse-channel').addEventListener('submit', (e) => {
  e.preventDefault();
  const channel = channelInput.value.trim().toLowerCase();
  if (!channel) return;
  localStorage.setItem('clipbot.lastChannel', channel);
  loadChannelVods(channel);
});

vodGrid.addEventListener('click', async (e) => {
  const up = e.target.closest('.upload-vod');
  const btn = up || e.target.closest('.download-vod');
  if (!btn) return;
  const label = btn.textContent;
  const body = { url: btn.dataset.url, quality: qualityPicker.value || null };
  if (up) {
    // Publishing is the one action here that leaves this machine, so confirm it.
    const vis = privacyPicker.value;
    if (!confirm('Upload this VOD to YouTube as ' + vis.toUpperCase() + '?\n\n' +
                 'It is relayed straight from Kick - nothing is saved on this computer.')) return;
    body.action = 'upload';
    body.privacy = vis;
  }
  btn.disabled = true;
  btn.textContent = 'Starting…';
  try {
    const res = await api('/api/workspaces', 'POST', body);
    location.href = '/w/' + res.slug;
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
    btn.textContent = label;
  }
});

onEvent('workspace', loadWorkspaces);
onEvent('job', loadWorkspaces);
loadWorkspaces();
</script>
{% endblock %}
