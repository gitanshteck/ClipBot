{% extends "base.html" %}
{% block content %}
<section class="panel">
  <a class="back" href="/{{ platform }}">&larr; {{ 'YouTube' if platform == 'youtube' else 'Kick' }}</a>
  <h1 id="ws-title">…</h1>
  <div id="ws-meta" class="meta"></div>
  <div id="external" class="banner" hidden></div>
  <div id="lowres" class="banner warn" hidden></div>
</section>

<section class="panel">
  <h2>Pipeline</h2>
  <div id="stages" class="stages"></div>
  <div class="row">
    <button id="run-all">Run all remaining</button>
    <a class="btn" id="review-link" href="/w/{{ slug }}/review">Review clips</a>
    <a class="btn" id="compile-link" href="/w/{{ slug }}/compile">Compilations</a>
    <a class="btn" id="csv-link" href="/media/{{ slug }}/manifest.csv">Download manifest.csv</a>
  </div>
</section>

<section class="panel">
  <h2>Cut clips</h2>
  <div id="cutlist" class="cutlist"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
const SLUG = {{ slug|tojson }};

async function load() {
  const w = await api('/api/workspaces/' + SLUG);
  document.getElementById('ws-title').textContent = w.title;
  document.getElementById('ws-meta').innerHTML =
    `${w.duration ? fmtDur(w.duration) : '—'} · ${w.disk_human}` +
    (w.video_height ? ` · ${w.video_width}×${w.video_height}` : '') +
    (w.source_mode === 'embed' ? ' · audio only — the video plays from YouTube' : '') +
    (w.url ? ` · <a href="${esc(w.url)}" target="_blank" rel="noreferrer">source</a>` : '');

  // A job started from the CLI isn't in this server's job runner, so surface it
  // from the filesystem instead of pretending the workspace is idle.
  const ext = document.getElementById('external');
  if (w.external) {
    ext.hidden = false;
    ext.className = 'banner ' + (w.external.stalled ? 'warn' : '');
    ext.innerHTML = w.external.stalled
      ? `A <b>${w.external.kind}</b> started outside the dashboard looks stalled — no file activity for ${Math.round(w.external.idle_seconds)}s.`
      : `▶ <b>${w.external.kind}</b> running (started from the command line, so it won't appear in Jobs)`
        + (w.external.human ? ` — ${w.external.human} so far` : '');
  } else { ext.hidden = true; }

  const lowres = document.getElementById('lowres');
  if (w.low_res) {
    lowres.hidden = false;
    lowres.innerHTML = `This VOD downloaded at <b>${w.video_width}×${w.video_height}</b> — too low to review clips visually.
      Kick serves up to 720p60. <button class="btn" onclick="submitJob('download',{force:true, quality:'720'})">Re-download at 720p</button>`;
  } else { lowres.hidden = true; }

  document.getElementById('stages').innerHTML = w.stages.map(s => {
    const state = s.done ? 'done' : (s.ready ? 'ready' : 'blocked');
    const label = s.done ? 'Re-run' : 'Run';
    // Don't offer a Run button for whatever is already running elsewhere -
    // a second concurrent download would fight over the same output file.
    const busy = w.external && (w.external.kind === s.key || w.external.kind === 'pipeline');
    const disabled = ((!s.done && !s.ready) || busy) ? 'disabled' : '';
    const detail = s.detail && Object.keys(s.detail).length
      ? Object.entries(s.detail).filter(([k]) => k !== 'completed_at').map(([k,v]) => `${k}: ${v}`).join(' · ')
      : (s.blocked || '');
    const isTranscribe = s.key === 'transcribe';
    // The quality picker is a Kick thing: a YouTube workspace's download stage
    // fetches audio only, so there is no resolution to choose.
    const isDownload = s.key === 'download' && w.platform !== 'youtube';
    const backendPicker = isTranscribe
      ? `<select id="transcribe-backend" title="Transcription backend">
           <option value="openai">OpenAI API (fast, paid)</option>
           <option value="local">Local (faster-whisper, free)</option>
         </select>`
      : '';
    const qualityPicker = isDownload ? qualityPickerHtml('download-quality') : '';
    const jobOpts = isTranscribe
      ? `{force:${s.done ? 'true' : 'false'}, backend: document.getElementById('transcribe-backend').value}`
      : isDownload
      ? `{force:${s.done ? 'true' : 'false'}, quality: document.getElementById('download-quality').value || null}`
      : `{force:${s.done ? 'true' : 'false'}}`;
    return `<div class="stage ${state}">
      <div class="stage-head"><span class="dot ${state}"></span><b>${s.label}</b></div>
      <div class="stage-detail">${esc(detail)}</div>
      ${backendPicker}
      ${qualityPicker}
      <button ${disabled} onclick="submitJob('${s.key}',${jobOpts})">${label}</button>
    </div>`;
  }).join('');

  // The selects above are rebuilt from scratch every load() (poll/SSE/10s
  // interval), so remember the user's last choice the same way the Kick
  // channel-browse picker does (library.html's clipbot.lastChannel).
  const backendSel = document.getElementById('transcribe-backend');
  if (backendSel) {
    backendSel.value = localStorage.getItem('clipbot.transcribeBackend') || 'openai';
    backendSel.addEventListener('change', () =>
      localStorage.setItem('clipbot.transcribeBackend', backendSel.value));
  }
  const qualitySel = document.getElementById('download-quality');
  if (qualitySel) {
    qualitySel.value = localStorage.getItem('clipbot.downloadQuality') || '';
    qualitySel.addEventListener('change', () =>
      localStorage.setItem('clipbot.downloadQuality', qualitySel.value));
  }

  const cuts = await api('/api/workspaces/' + SLUG + '/clips').catch(() => ({clips: []}));
  const cut = (cuts.clips || []).filter(c => c.output && c.output.file);
  document.getElementById('cutlist').innerHTML = cut.length
    ? cut.map(c => `<div class="cutrow">
        <video src="/media/${SLUG}/clip/${c.output.file.split('/').pop()}" controls preload="none"></video>
        <div><b>${esc(c.title || c.description.slice(0,60))}</b>
        <div class="meta">${fmtDur(c.start)}–${fmtDur(c.end)} · ${(c.output.bytes/1048576).toFixed(1)} MB</div></div>
      </div>`).join('')
    : (w.platform === 'youtube'
        ? '<p class="empty">No clips fetched yet. Approve candidates in Review, then run Fetch approved clips: only those seconds are downloaded from YouTube, never the whole video.</p>'
        : '<p class="empty">Nothing cut yet. Approve candidates in Review, then run Cut clips.</p>');
}

async function submitJob(kind, opts) {
  try { await api(`/api/workspaces/${SLUG}/jobs`, 'POST', Object.assign({kind}, opts||{})); }
  catch (e) { alert(e.message); }
}
window.submitJob = submitJob;

document.getElementById('run-all').addEventListener('click', () => {
  // The download stage row (always present) carries the quality picker;
  // pipeline re-uses its current value since pipeline downloads too.
  const q = document.getElementById('download-quality');
  submitJob('pipeline', q && q.value ? { quality: q.value } : {});
});
onEvent('workspace', load);
onEvent('job', load);
load();
// CLI-driven work emits no SSE events, so poll while something external is
// running. Cheap, and only while there's actually something to watch.
setInterval(load, 10000);
</script>
{% endblock %}
