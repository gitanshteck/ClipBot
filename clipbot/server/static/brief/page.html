<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teck Cue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/*__SCENES_CSS__*/
/* The rundown page: a broadcast run-sheet on a navy control-room desk. Single theme on purpose (it sits next to OBS). */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ink); color: var(--text); font: 400 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 64px; }
.muted { color: var(--muted); }

.xnav { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 14px; font: 600 12px/1 var(--mono); letter-spacing: .06em; }
.xnav a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
.xnav a:first-child { color: var(--text); }
.xnav a:hover { color: var(--accent); border-color: var(--accent); }
.slate { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mark { font: 900 20px/1 var(--display); letter-spacing: .02em; }
.mark b { color: var(--accent); font-weight: 900; }
.mark small { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .14em; margin-left: 10px; vertical-align: middle; }
.slate-meta { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font: 500 12px/1.2 var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.slate-meta strong { color: var(--text); font-weight: 700; }
.live-dot { display: inline-flex; align-items: center; gap: 6px; }
.live-dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.live-dot.on i { background: var(--good); }

.hero { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; padding: 34px 0 26px; align-items: end; }
.kicker { font: 700 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 10px; }
.kicker::before { content: ""; width: 26px; height: 2px; background: var(--accent); }
.hero h1 { font: 900 clamp(30px, 5.2vw, 60px)/1.02 var(--display); letter-spacing: -.01em; margin: 14px 0; }
.hero p { margin: 0; max-width: 62ch; color: var(--muted); font-size: 16px; }
.tuned { margin-top: 14px !important; color: var(--clip) !important; font-size: 14px !important; }
.golive { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.golive .times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.golive .t { font: 700 26px/1 var(--mono); }
.golive .tz { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .12em; margin-top: 6px; }
.btn-air { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 10px; padding: 14px 16px; background: var(--rec); color: #fff; font: 700 14px/1 var(--display); letter-spacing: .06em; cursor: pointer; text-transform: uppercase; }
.btn-air:hover { filter: brightness(1.08); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-sub { border: 1px solid var(--line); background: var(--raise); color: var(--text); border-radius: 10px; padding: 10px; font: 600 13px/1.2 var(--body); cursor: pointer; text-align: center; text-decoration: none; }
.btn-sub:hover { border-color: var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px rgba(255,255,255,.18); }
.plat-line { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font: 600 11px/1.5 var(--body); color: var(--muted); white-space: nowrap; text-decoration: none; }
.chip.acc { color: var(--accent); border-color: rgba(25,162,210,.45); }
.chip.clip { color: var(--clip); border-color: rgba(242,179,61,.45); }
.chip.rec { color: var(--rec); border-color: rgba(255,77,94,.45); }
.chip.good { color: var(--good); border-color: rgba(60,203,140,.45); }

.fb { display: inline-flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.fb button { display: none; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 2px 9px; font: 600 11px/1.6 var(--body); cursor: pointer; }
.fb button:hover { color: var(--text); border-color: var(--muted); }
.has-fb .fb .r { display: inline-block; }
.has-cm .fb .c { display: inline-block; }
.fb button.on[data-r="more"] { color: var(--good); border-color: var(--good); }
.fb button.on[data-r="less"] { color: var(--clip); border-color: var(--clip); }
.fb button.on[data-r="drop"] { color: var(--rec); border-color: var(--rec); }
.fb-tray { margin-top: 10px; }
.dropped { opacity: .5; }

.strip { margin: 6px 0 34px; }
.strip-track { position: relative; display: flex; gap: 3px; height: 74px; }
.seg { position: relative; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); padding: 9px 10px; overflow: hidden; min-width: 0; cursor: pointer; text-align: left; color: inherit; }
.seg:hover { background: var(--raise); }
.seg .sn { font: 600 12px/1.25 var(--body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.seg .st { font: 500 10.5px/1 var(--mono); color: var(--muted); margin-top: 6px; }
.seg::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--k, var(--line)); }
.seg.clipbait::before { content: ""; position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--clip); }
.seg.game { background: repeating-linear-gradient(135deg, var(--panel) 0 8px, #101215 8px 16px); }
.seg.pre { background: repeating-linear-gradient(45deg, var(--panel) 0 6px, #14171a 6px 12px); }
.ruler { position: relative; height: 22px; margin-top: 6px; font: 500 10.5px/1 var(--mono); color: var(--muted); }
.ruler span { position: absolute; top: 6px; transform: translateX(-50%); white-space: nowrap; }
.ruler span::before { content: ""; position: absolute; left: 50%; top: -7px; width: 1px; height: 5px; background: var(--line); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.k-talk { --k: var(--accent); } .k-chat { --k: #7FD3F0; } .k-react { --k: #A78BFA; } .k-transition { --k: var(--muted); } .k-game { --k: var(--good); } .k-starting { --k: var(--rec); }

.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; align-items: start; }
section { margin-top: 44px; }
.grid section:first-child, .grid > div > section:first-child { margin-top: 0; }
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.sh h2 { font: 700 19px/1.2 var(--display); letter-spacing: .01em; }
.sh .tag { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }

.run { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; padding: 16px; position: relative; }
.row.done { opacity: .45; }
.row.live { border-color: var(--rec); box-shadow: 0 0 0 1px var(--rec) inset; }
.row .tc { font: 700 15px/1 var(--mono); }
.row .tc small { display: block; font: 500 11px/1 var(--mono); color: var(--muted); margin-top: 6px; }
.row .rail { position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--k); }
.row h3 { font: 600 16px/1.3 var(--body); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-right: 120px; }
.screenline { margin: 8px 0 0; font: 700 13px/1.3 var(--display); letter-spacing: .01em; }
.screenline span { color: var(--muted); font: 500 12px/1.3 var(--body); margin-left: 6px; }
.say { margin: 10px 0 0; padding-left: 12px; border-left: 2px solid var(--accent); font-style: italic; }
.notes { margin: 10px 0 0; padding-left: 18px; }
.notes li { margin: 2px 0; }
.why { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.why::before { content: "from your streams · "; font: 600 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.plain { margin: 10px 0 0; font-size: 13px; }
.prompt { margin-top: 10px; display: inline-flex; gap: 8px; align-items: center; font: 500 13px/1.4 var(--body); background: var(--raise); border-radius: 8px; padding: 6px 10px; }
.prompt b { font: 700 10.5px/1 var(--mono); letter-spacing: .1em; color: var(--accent); }
.row-acts { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center; }
.row-acts .go { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 3px 8px; font: 600 11px/1.4 var(--mono); cursor: pointer; }
.row-acts .go:hover { color: var(--rec); border-color: var(--rec); }
.tick { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.tick input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
.items-ref { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.rounds { margin: 10px 0 0; padding-left: 18px; font-size: 13.5px; }
.rounds b { color: var(--clip); font-weight: 600; }

.stack { display: grid; gap: 12px; }
.plat { padding: 14px 16px; display: grid; gap: 6px; }
.plat-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.plat-h strong { font: 700 15px/1.2 var(--display); }
.plat p { margin: 0; font-size: 13.5px; color: var(--muted); }
.plat .act { font-size: 13.5px; }
.timing { padding: 14px 16px; display: grid; gap: 8px; font-size: 13.5px; }
.timing .big { display: flex; align-items: center; gap: 10px; font: 700 18px/1.2 var(--mono); }
.list { margin: 0; padding: 14px 16px 14px 34px; display: grid; gap: 7px; font-size: 13.5px; }
.titles { padding: 6px; display: grid; gap: 4px; }
.titlebtn { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; color: var(--text); font: 500 13.5px/1.4 var(--body); padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.titlebtn:hover { background: var(--raise); }
.titlebtn span:last-child { font: 600 10.5px/1 var(--mono); color: var(--muted); letter-spacing: .08em; flex-shrink: 0; }
.mini-list { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }

.scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.scene-tile { padding: 12px; display: grid; gap: 10px; align-content: start; }
.scene-tile .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; background: #000; cursor: pointer; border: 1px solid var(--line); }
.scene-tile .frame.tall { aspect-ratio: auto; width: 236px; height: 420px; justify-self: center; }
.scene-tile .frame:hover { border-color: var(--accent); }
.scene-tile h3 { font: 600 14.5px/1.3 var(--body); }
.scene-tile p { margin: 0; font-size: 12.5px; color: var(--muted); }
.scene-tile .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.obs { padding: 16px 18px; display: grid; gap: 12px; font-size: 13.5px; }
.obs ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.urls { display: grid; gap: 6px; }
.url { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--raise); border-radius: 8px; padding: 8px 10px; }
.url b { font-weight: 600; }
.url code { font: 500 12px/1.4 var(--mono); color: var(--accent); word-break: break-all; }
.url button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 3px 8px; font: 600 11px/1.4 var(--mono); cursor: pointer; }
.url button:hover { color: var(--text); }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.keys kbd { font: 700 11px/1 var(--mono); color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; margin-right: 6px; }

.docket { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.dk { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.dk-face { padding: 16px 16px 14px; background: linear-gradient(135deg, #17191d, #0E0F11); border-bottom: 1px solid var(--line); position: relative; }
.dk-face::before { content: ""; position: absolute; left: 0; top: 0; height: 3px; width: 100%; background: var(--accent); }
.dk-face .bugline { font: 700 10.5px/1 var(--mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
.dk-face .bugline b { color: var(--accent); }
.dk-face .cardt { font: 900 20px/1.1 var(--display); margin: 10px 0 0; text-transform: lowercase; }
.dk-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.dk-body h3 { font: 600 14px/1.4 var(--body); color: var(--muted); }
.dk .take { margin: 0; font-style: italic; padding-left: 10px; border-left: 2px solid var(--accent); }
.dk .q { margin: 0; font-size: 13.5px; }
.dk .q b { font: 700 10.5px/1 var(--mono); letter-spacing: .1em; color: var(--accent); margin-right: 6px; }
.dk .angle { margin: 0; font-size: 12.5px; color: var(--good); }
.dk .risk { margin: 0; font-size: 12.5px; color: var(--muted); }
.dk .src { margin-top: auto; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 3px; align-items: center; }
.pips i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--clip); }
.block-h { font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
.polls { display: flex; gap: 6px; flex-wrap: wrap; }

.games { display: grid; gap: 8px; }
.gm { display: grid; grid-template-columns: 34px minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 2fr); gap: 16px; padding: 14px 16px; align-items: start; }
.gm .rk { font: 900 20px/1 var(--display); color: var(--muted); }
.gm.top .rk { color: var(--accent); }
.gm h3 { font: 600 15.5px/1.3 var(--body); }
.gm .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.gm .verdict { margin: 0; font-size: 13.5px; }
.gm .fit, .gm .up { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.metric { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.metric .v { font: 700 14px/1 var(--mono); color: var(--text); }
.bar { height: 6px; background: var(--raise); border-radius: 0 4px 4px 0; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.gm-more summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 8px 2px; }

.week { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.day { padding: 12px; display: grid; gap: 6px; align-content: start; }
.day .d { font: 700 13px/1 var(--mono); }
.day.today { border-color: var(--accent); }
.day p { margin: 0; font-size: 13px; }
.cal { margin: 0; padding: 0; list-style: none; }
.cal li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13.5px; }
.cal li:first-child { border-top: 0; }
.cal .cd { font: 700 12.5px/1.4 var(--mono); }
.cal .cd small { display: block; font-weight: 500; color: var(--muted); }

.evi { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
.chart { padding: 18px; position: relative; }
.chart h3 { font: 600 14px/1.3 var(--body); margin-bottom: 14px; }
.cr { display: grid; grid-template-columns: 150px minmax(0, 1fr) 48px; gap: 12px; align-items: center; padding: 7px 0; }
.cr .lb { font-size: 13px; }
.cr .vb { height: 18px; position: relative; }
.cr .vb i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; }
.cr .vb::before { content: ""; position: absolute; left: 0; top: -4px; bottom: -4px; width: 1px; background: var(--line); }
.cr .vl { font: 700 13px/1 var(--mono); text-align: right; }
.cr:hover .vb i, .cr:focus-visible .vb i { filter: brightness(1.18); }
.tip { position: absolute; z-index: 5; pointer-events: none; background: #0A0B0D; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.4); opacity: 0; transition: opacity .12s; max-width: 240px; }
.tip.on { opacity: 1; }
.tablev summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.tablev table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.tablev td, .tablev th { text-align: left; padding: 5px 0; border-top: 1px solid var(--line); }
.tablev td:last-child, .tablev th:last-child { text-align: right; font-family: var(--mono); }
.lessons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.lesson { padding: 14px 16px; }
.lesson h3 { font: 600 14.5px/1.3 var(--body); margin-bottom: 4px; }
.lesson p { margin: 0; font-size: 13px; color: var(--muted); }
.scope { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; max-width: 80ch; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.beats { margin: 0; padding: 6px 16px; list-style: none; }
.beats li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.beats li:first-child { border-top: 0; }
.beats .ev { font: 600 11px/1.6 var(--mono); color: var(--good); letter-spacing: .06em; text-transform: uppercase; }
.beats .ev.c { color: var(--clip); }
footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; display: grid; gap: 8px; }
footer ul { margin: 0; padding-left: 18px; columns: 2; column-gap: 32px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--raise); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 90; }
.toast.on { opacity: 1; }

/* on-air view on this page (a preview of what OBS shows, and the claude.ai route to OBS) */
.air { position: fixed; inset: 0; z-index: 70; display: none; overflow: hidden; background: var(--ink); }
.air.on { display: block; }
.air.bg-green { background: var(--key); }
.air.bg-clear { background: transparent; }
html.clear-bg, html.clear-bg body { background: transparent; }
html.clear-bg .wrap { visibility: hidden; }
.air > .stage { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
.host { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 80; display: flex; gap: 14px; align-items: center; background: rgba(8,12,22,.92); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font: 500 13px/1.2 var(--mono); color: var(--muted); transition: opacity .25s; max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; }
.air.idle .host { opacity: 0; pointer-events: none; }
.host strong { color: var(--text); }
.host .hl { color: var(--clip); font-family: var(--body); font-style: italic; max-width: 520px; display: none; }
.air.hostlines .host .hl { display: block; }
.host button { background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 6px 9px; font: 600 12px/1 var(--mono); cursor: pointer; }
.host button:hover { background: rgba(255,255,255,.12); }
.host .clipb { color: var(--rec); border-color: rgba(255,77,94,.5); }

/* phone remote (claude.ai only) */
.remote { position: fixed; inset: 0; z-index: 75; display: none; background: var(--ink); padding: 16px; overflow-y: auto; }
.remote.on { display: block; }
.rm-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rm-now { margin: 16px 0; padding: 16px; display: grid; gap: 6px; }

<script>

    var r = btn.getAttribute("data-r"), next = reactions[key] === r ? null : r;
    reactions[key] = next; paintReactions();
    BK.saveFeedback({ date: B.date, edition: B.edition, kind: kind, target: id, label: f.getAttribute("data-fb-label"), reaction: next })
      .then(function () { toast(next ? "Noted for tomorrow's brief" : "Cleared"); }, function () { toast("Couldn't save that. Try again in a moment"); });
  }
  function comment(btn) {
    if (!BK.comments) { toast("Comments to Claude work on the claude.ai page"); return; }
    var el = btn.closest("[data-comment-target]") || btn;
    BK.comment(el).then(function (res) { if (res && res.opened) toast("Type your change, then Send to Claude"); }, function (err) {
      if (err && err.code === "unavailable") document.body.classList.remove("has-cm");
      toast("Commenting isn't available here");
    });
  }

  // ---------- routes ----------
  var curMode = "";
  function setHash(hh) { try { if (location.hash.slice(1) !== hh) history.replaceState(null, "", hh ? "#" + hh : location.pathname + location.search); } catch (e) {} }
  function goMode(mode) { setHash(mode); route(true, mode); }
  function route(gesture, forced) {
    var hsh = typeof forced === "string" ? forced : (location.hash || "").slice(1);
    gesture = gesture === true;
    if (hsh === curMode && (view === "air" || view === "remote")) return;
    curMode = /^(onair|vertical)(-green|-clear)?$|^remote$/.test(hsh) ? hsh : "";
    var m = /^(onair|vertical)(?:-(green|clear))?$/.exec(hsh);
    if (m) openAir(m[2] || "brand", m[1] === "vertical" ? "v" : "h", gesture);
    else if (hsh === "remote" && !LOCAL) openRemote();
    else if (view === "air") closeAir();
    else if (view === "remote") { remote.classList.remove("on"); view = "page"; }
  }
  window.addEventListener("hashchange", function () { route(false); });
  route(false);
})();
</script>
</body>
</html>
